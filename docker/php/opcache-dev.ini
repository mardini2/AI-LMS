; Opcache tuning for Moodle development on Windows Docker bind mounts.
;
; The default revalidate_freq=2 causes PHP to stat() every cached file
; every 2 seconds. On Windows (NTFS→WSL2→Docker), each stat() is ~1-5ms,
; and Moodle includes ~2000 files per request — totalling 10+ seconds/page.
;
; Setting revalidate_freq=60 means most requests use cached bytecode with
; zero stat() calls. One request per minute will be slow (the stat sweep).
; Run `.\dev.ps1 moodle-purge` to force an immediate refresh after editing
; PHP files, or simply wait up to 60 seconds.

opcache.memory_consumption=256
opcache.interned_strings_buffer=24
opcache.max_accelerated_files=30000
opcache.revalidate_freq=60
