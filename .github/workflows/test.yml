name: Test

on:
  push:
    branches:
      - feature/demo-prep
      - feature/demo-prep-auto-tests
  pull_request:
    branches:
      - feature/demo-prep
      - feature/demo-prep-auto-tests

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: api_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: syllentras_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U api_user -d syllentras_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://api_user:password@localhost:5432/syllentras_test
          MOODLE_INTERNAL_URL: http://localhost:8000
          MOODLE_TOKEN: test-token
          MOODLE_INTERNAL_HOST: localhost:8000
          GEMINI_API_KEY: test-gemini-key
          CORS_ORIGIN: http://localhost:8000
